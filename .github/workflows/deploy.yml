# ============================================
# 🚀 Deploy WhatsApp Bot - EC2 (Simple)
# ============================================

name: Deploy WhatsApp Bot

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'index.js'
      - 'Dockerfile'
      - 'package.json'
      - 'docker-compose.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Deploy to EC2
      uses: appleboy/ssh-action@v0.1.8
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          cd /home/ubuntu/whatsapp-bot
          
          # Pull latest code
          git pull origin main
          
          # Rebuild and restart
          docker compose down
          docker compose up -d --build
          
          # Show logs
          docker compose logs --tail=20