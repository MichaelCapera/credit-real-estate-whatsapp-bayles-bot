name: Deploy WhatsApp Bot

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'index.js'
      - 'src/**'
      - 'Dockerfile'
      - 'package.json'
      - 'docker-compose.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup SSH key
      run: |
        echo "${{ secrets.EC2_SSH_KEY }}" > key.pem
        chmod 600 key.pem

    - name: Copy files to EC2
      run: |
        scp -r -o StrictHostKeyChecking=no -i key.pem \
          index.js \
          src \
          ubuntu@${{ secrets.EC2_HOST }}:/home/ubuntu/whatsapp-bot/

    - name: Rebuild and restart
      run: |
        ssh -o StrictHostKeyChecking=no -i key.pem \
          ubuntu@${{ secrets.EC2_HOST }} \
          "cd /home/ubuntu/whatsapp-bot && docker compose down && docker compose up -d --build && docker compose logs --tail=20"